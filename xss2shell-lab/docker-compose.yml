version: '3.8'

services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - xss2shell-net

  wordpress:
    image: wordpress:6.7.0-php8.1-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
    volumes:
      - wp_data:/var/www/html
      - ./make-vulnerable.php:/usr/local/bin/make-vulnerable.php
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./exploit.php:/var/www/html/wp-admin/xss2shell-exploit.php
    networks:
      - xss2shell-net

volumes:
  db_data:
  wp_data:

networks:
  xss2shell-net:
